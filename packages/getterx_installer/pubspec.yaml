name: getterx_installer
description: "GetterX: installs APKs (silent updates on Android 12+), reads installed app versions and signatures."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: io.github.gmwester.getterx_installer
        pluginClass: GetterxInstallerPlugin
