name: Build & Release

# Every push/PR builds and tests all platforms.
# A GitHub release is created only on the default branch, and only when the
# version in pubspec.yaml has no release yet ("v<version>"): bump the version
# to publish an update. One release holds every platform's files.
#
# Platform branches (platform/android, platform/ios, platform/windows,
# platform/macos, platform/linux, platform/lite) build and test only their
# platform. They are kept up to date with main automatically (merge).

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.50.0'

jobs:
  test:
    # A pull request from a branch of this repository is already built by its
    # push run; building it twice only doubles the queue for the (limited)
    # macOS runners. Pull requests from forks are still built here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build_number: ${{ steps.v.outputs.build_number }}
      targets: ${{ steps.t.outputs.targets }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Platforms to build
        id: t
        run: |
          case "$GITHUB_REF_NAME" in
            platform/*) echo "targets=${GITHUB_REF_NAME#platform/}" >> "$GITHUB_OUTPUT" ;;
            *) echo "targets=android ios windows macos linux lite" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Version
        id: v
        run: |
          V=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          IFS=. read -r MA MI PA <<< "$V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Monotonic Android versionCode derived from the version (split APKs add 1000*abi).
          echo "build_number=$((MA*1000000 + MI*10000 + PA*100))" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Dependency vulnerability scan (OSV.dev)
        run: python3 tool/osv_check.py pubspec.lock packages/getterx_core/pubspec.lock
      - name: Core engine tests
        working-directory: packages/getterx_core
        run: |
          dart pub get
          dart analyze
          dart test

  android:
    needs: test
    if: contains(needs.test.outputs.targets, 'android')
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing key
        id: key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS" ]; then
            echo "::warning::No Android signing secrets: APKs are debug-signed and will NOT be released."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KS" | base64 -d > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi --build-number=${{ needs.test.outputs.build_number }}
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/GetterX-android-$abi.apk"
          done
          flutter build apk --release --build-number=${{ needs.test.outputs.build_number }}
          cp build/app/outputs/flutter-apk/app-release.apk dist/GetterX-android-universal.apk
      - name: Verify signature
        if: steps.key.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in dist/*.apk; do "$APKSIGNER" verify --print-certs "$f" | grep -q "CN=GetterX" || { echo "bad signature: $f"; exit 1; }; done
      - name: Remove key material
        if: always()
        run: rm -f android/app/release.jks android/key.properties
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  linux:
    needs: test
    if: contains(needs.test.outputs.targets, 'linux')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: ubuntu-22.04, deb: amd64, appimage: x86_64 }
          - { arch: arm64, runner: ubuntu-22.04-arm, deb: arm64, appimage: aarch64 }
    runs-on: ${{ matrix.runner }}
    # ARM64 runners/toolchains are newer; never let them block a release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v5
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev liblzma-dev clang cmake pkg-config libfuse2 file
          flutter --version
      - name: Build
        run: |
          flutter build linux --release --build-number=${{ needs.test.outputs.build_number }}
          (cd packages/getterx_core && dart pub get && dart compile exe bin/getterx_cli.dart -o ../../build/getterx-cli)
      - name: Package (portable tar.gz, .deb, AppImage)
        run: |
          V=${{ needs.test.outputs.version }}
          A=${{ matrix.arch }}
          B=build/linux/$A/release/bundle
          mkdir -p dist
          # Portable / folder build
          mkdir -p pkg/GetterX && cp -a $B/. pkg/GetterX/ && cp build/getterx-cli pkg/GetterX/
          cp installer/linux/portable.txt pkg/GetterX/
          tar -C pkg -czf dist/GetterX-linux-$A-portable.tar.gz GetterX
          # .deb (installed to /opt/getterx)
          D=pkg/deb
          mkdir -p $D/DEBIAN $D/opt/getterx $D/usr/bin $D/usr/share/applications $D/usr/share/icons/hicolor/256x256/apps
          cp -a $B/. $D/opt/getterx/ && cp build/getterx-cli $D/opt/getterx/
          ln -s /opt/getterx/getterx $D/usr/bin/getterx
          ln -s /opt/getterx/getterx-cli $D/usr/bin/getterx-cli
          cp installer/linux/getterx.desktop $D/usr/share/applications/
          cp assets/icon.png $D/usr/share/icons/hicolor/256x256/apps/getterx.png
          cat > $D/DEBIAN/control <<CTRL
          Package: getterx
          Version: $V
          Architecture: ${{ matrix.deb }}
          Maintainer: GetterX <noreply@github.com>
          Depends: libgtk-3-0, libsecret-1-0
          Section: utils
          Priority: optional
          Homepage: https://github.com/gmwester/GetterX
          Description: Automatic downloads from GitHub, Modrinth, CurseForge, itch.io and more
          CTRL
          sed -i 's/^ *//' $D/DEBIAN/control
          dpkg-deb --root-owner-group --build $D dist/GetterX-linux-$A.deb
          # AppImage
          AD=pkg/GetterX.AppDir
          mkdir -p $AD && cp -a $B/. $AD/ && cp build/getterx-cli $AD/
          cp installer/linux/getterx.desktop $AD/getterx.desktop
          cp assets/icon.png $AD/getterx.png
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/getterx" "$@"\n' > $AD/AppRun
          chmod +x $AD/AppRun
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage }}.AppImage
          chmod +x appimagetool
          ARCH=${{ matrix.appimage }} APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool $AD dist/GetterX-linux-$A.AppImage
          cp build/getterx-cli dist/getterx-cli-linux-$A
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: test
    if: contains(needs.test.outputs.targets, 'windows')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v5
      - name: Flutter ${{ env.FLUTTER_VERSION }}
        shell: pwsh
        run: |
          git clone --depth 1 --branch "$env:FLUTTER_VERSION" https://github.com/flutter/flutter.git "$env:RUNNER_TEMP\flutter"
          "$env:RUNNER_TEMP\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build
        shell: bash
        run: |
          flutter --version
          flutter build windows --release --build-number=${{ needs.test.outputs.build_number }}
          (cd packages/getterx_core && dart pub get && dart compile exe bin/getterx_cli.dart -o ../../build/windows/${{ matrix.arch }}/runner/Release/getterx-cli.exe)
      - name: Installer (install or portable)
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force dist | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.test.outputs.version }}" "/DArch=${{ matrix.arch }}" "/DSourceDir=..\..\build\windows\${{ matrix.arch }}\runner\Release" installer\windows\getterx.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg\GetterX | Out-Null
          Copy-Item -Recurse build\windows\${{ matrix.arch }}\runner\Release\* pkg\GetterX\
          Copy-Item installer\windows\portable.txt pkg\GetterX\
          Compress-Archive -Path pkg\GetterX -DestinationPath dist\GetterX-windows-${{ matrix.arch }}-portable.zip
          Copy-Item build\windows\${{ matrix.arch }}\runner\Release\getterx-cli.exe dist\getterx-cli-windows-${{ matrix.arch }}.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    needs: test
    if: contains(needs.test.outputs.targets, 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          flutter build macos --release --build-number=${{ needs.test.outputs.build_number }}
          (cd packages/getterx_core && dart pub get && dart compile exe bin/getterx_cli.dart -o ../../build/getterx-cli)
      - name: Package (zip, portable zip, dmg)
        run: |
          APP=build/macos/Build/Products/Release/GetterX.app
          mkdir -p dist pkg/GetterX pkg/dmg
          ditto -c -k --keepParent "$APP" dist/GetterX-macos.zip
          ditto "$APP" pkg/GetterX/GetterX.app
          cp installer/macos/portable.txt pkg/GetterX/
          (cd pkg && ditto -c -k --keepParent GetterX ../dist/GetterX-macos-portable.zip)
          ditto "$APP" pkg/dmg/GetterX.app && ln -s /Applications pkg/dmg/Applications
          hdiutil create -volname GetterX -srcfolder pkg/dmg -ov -format UDZO dist/GetterX-macos.dmg
          cp build/getterx-cli dist/getterx-cli-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  ios:
    needs: test
    if: contains(needs.test.outputs.targets, 'ios')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build (unsigned, for AltStore / SideStore / your own signing)
        run: |
          flutter build ios --release --no-codesign --build-number=${{ needs.test.outputs.build_number }}
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr dist/GetterX-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*

  # GetterX Lite: the browser-based version for systems the desktop app
  # cannot run on (32-bit x86 / ARM, RISC-V, older OS versions, servers).
  lite:
    needs: test
    if: contains(needs.test.outputs.targets, 'lite')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - name: Native builds (32-bit ARM Linux, RISC-V Linux)
        working-directory: packages/getterx_core
        run: |
          dart pub get
          mkdir -p ../../dist
          for a in arm riscv64; do
            dart compile exe --target-os=linux --target-arch=$a bin/getterx_cli.dart -o ../../dist/getterx-cli-linux-$a
          done
      - name: 32-bit x86 Linux (Dart 3.8.0 = last SDK with 32-bit x86)
        run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y libc6:i386
          curl -fsSL -o d.zip https://storage.googleapis.com/dart-archive/channels/stable/release/3.8.0/sdk/dartsdk-linux-ia32-release.zip
          echo "$(curl -fsSL https://storage.googleapis.com/dart-archive/channels/stable/release/3.8.0/sdk/dartsdk-linux-ia32-release.zip.sha256sum | cut -d' ' -f1)  d.zip" | sha256sum -c -
          unzip -q d.zip -d "$RUNNER_TEMP/dart38"
          DART="$RUNNER_TEMP/dart38/dart-sdk/bin/dart"
          cd packages/getterx_core && rm -f pubspec.lock && "$DART" pub get
          "$DART" --snapshot=getterx.dill --snapshot-kind=kernel bin/getterx_cli.dart
          L=../../pkg/GetterX-Lite && mkdir -p $L
          cp "$DART" $L/dart && cp getterx.dill $L/ && cp "$RUNNER_TEMP/dart38/dart-sdk/LICENSE" $L/DART-LICENSE
          printf '#!/bin/sh\nHERE="$(dirname "$(readlink -f "$0")")"\nexec "$HERE/dart" "$HERE/getterx.dill" "$@"\n' > $L/getterx-cli
          chmod +x $L/getterx-cli $L/dart
          "$L/getterx-cli" --data "$RUNNER_TEMP/t" paths
          tar -C ../../pkg -czf ../../dist/GetterX-Lite-linux-x86.tar.gz GetterX-Lite
      - uses: actions/upload-artifact@v4
        with:
          name: lite-linux
          path: dist/*

  lite-windows-x86:
    needs: test
    if: contains(needs.test.outputs.targets, 'lite')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: 32-bit Windows (Dart 3.8.0 = last SDK with 32-bit x86)
        shell: pwsh
        run: |
          $u = "https://storage.googleapis.com/dart-archive/channels/stable/release/3.8.0/sdk/dartsdk-windows-ia32-release.zip"
          Invoke-WebRequest $u -OutFile d.zip
          Invoke-WebRequest "$u.sha256sum" -OutFile d.sha256
          $expected = ((Get-Content d.sha256 -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash d.zip -Algorithm SHA256).Hash.ToLower() -ne $expected.ToLower()) { throw "Dart SDK checksum mismatch" }
          Expand-Archive d.zip -DestinationPath "$env:RUNNER_TEMP\dart38"
          $dart = "$env:RUNNER_TEMP\dart38\dart-sdk\bin\dart.exe"
          Push-Location packages\getterx_core
          Remove-Item pubspec.lock -ErrorAction SilentlyContinue
          & $dart pub get
          & $dart --snapshot=getterx.dill --snapshot-kind=kernel bin\getterx_cli.dart
          Pop-Location
          New-Item -ItemType Directory -Force pkg\GetterX-Lite, dist | Out-Null
          Copy-Item $dart pkg\GetterX-Lite\dart.exe
          Copy-Item packages\getterx_core\getterx.dill pkg\GetterX-Lite\
          Copy-Item "$env:RUNNER_TEMP\dart38\dart-sdk\LICENSE" pkg\GetterX-Lite\DART-LICENSE.txt
          Set-Content pkg\GetterX-Lite\getterx-cli.cmd "@`"%~dp0dart.exe`" `"%~dp0getterx.dill`" %*"
          Set-Content "pkg\GetterX-Lite\GetterX Lite.cmd" "@`"%~dp0dart.exe`" `"%~dp0getterx.dill`" serve"
          & pkg\GetterX-Lite\getterx-cli.cmd --data "$env:RUNNER_TEMP\t" paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path pkg\GetterX-Lite -DestinationPath dist\GetterX-Lite-windows-x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: lite-windows-x86
          path: dist/*

  lite-macos-intel:
    needs: test
    if: contains(needs.test.outputs.targets, 'lite')
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - name: Intel Mac command line / Lite
        working-directory: packages/getterx_core
        run: |
          dart pub get
          mkdir -p ../../dist
          dart compile exe bin/getterx_cli.dart -o ../../dist/getterx-cli-macos-x64
      - uses: actions/upload-artifact@v4
        with:
          name: lite-macos-x64
          path: dist/*

  release:
    needs: [test, android, linux, windows, macos, ios, lite, lite-windows-x86, lite-macos-intel]
    # Required: test, android, ios, macos, lite builds and the x64 desktop builds.
    # ARM64 desktop and Intel-Mac CLI builds are optional (continue-on-error).
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      needs.test.result == 'success' && needs.android.result == 'success' && needs.ios.result == 'success' &&
      needs.macos.result == 'success' && needs.lite.result == 'success' && needs.lite-windows-x86.result == 'success' &&
      needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Is this version already released?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.test.outputs.version }}
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$V already released - bump the version in pubspec.yaml to publish an update."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Require signed Android build
        if: steps.check.outputs.skip == 'false' && needs.android.outputs.signed != 'true'
        run: |
          echo "::error::Android signing secrets are missing - refusing to publish debug-signed APKs."
          exit 1
      - uses: actions/download-artifact@v4
        if: steps.check.outputs.skip == 'false'
        with:
          path: dist
          merge-multiple: true
      - name: Publish release v${{ needs.test.outputs.version }}
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.test.outputs.version }}
          cp installer/install.sh dist/getterx-install.sh
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "v$V" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GetterX $V" \
            --generate-notes

  # Keep platform/* branches in sync with main (merge, never force).
  sync-platform-branches:
    needs: test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge main into each platform branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in android ios windows macos linux lite; do
            b="platform/$p"
            if ! git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              git push origin "HEAD:refs/heads/$b"; continue
            fi
            git fetch origin "$b"
            git checkout -B "$b" "origin/$b"
            if git merge --no-edit "$GITHUB_SHA"; then
              git push origin "$b"
            else
              git merge --abort
              echo "::warning::$b has conflicts with main - merge it by hand."
            fi
          done
